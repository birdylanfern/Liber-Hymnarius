<!DOCTYPE html>
<html lang="la">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cantus – Officium Liturgiae Horarum &amp; Graduale Simplex</title>
  <meta name="description" content="Latin chant for the Liturgy of the Hours and the Graduale Simplex, organised as in the Liber Hymnarius.">
  <link rel="icon" href="icon/clear-main.png" type="image/png">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="app.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="topbar hide-print">
    <a class="brand" href="#hymns" title="Cantus – home">
      <svg viewBox="0 0 24 32" width="18" height="24" aria-hidden="true"><path d="M10 0h4v9h8v4h-8v19h-4V13H2V9h8z" fill="currentColor"/></svg>
      <span class="brand-name">Cantus</span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Collections">
      <a href="#hymns" data-collection="hymns">Officium <small>Liturgia Horarum</small></a>
      <a href="#simplex" data-collection="simplex">Graduale Simplex</a>
    </nav>
    <span class="grow"></span>
    <a href="#settings" class="tool settings-btn" id="settings-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M11.6 2.1l.4 1.7c.5.1 1 .3 1.4.6l1.5-.9 1.7 1.7-.9 1.5c.3.4.5.9.6 1.4l1.7.4v2.4l-1.7.4c-.1.5-.3 1-.6 1.4l.9 1.5-1.7 1.7-1.5-.9c-.4.3-.9.5-1.4.6l-.4 1.7H8.4l-.4-1.7c-.5-.1-1-.3-1.4-.6l-1.5.9-1.7-1.7.9-1.5c-.3-.4-.5-.9-.6-1.4L2 11.2V8.8l1.7-.4c.1-.5.3-1 .6-1.4l-.9-1.5 1.7-1.7 1.5.9c.4-.3.9-.5 1.4-.6l.4-1.7h3.2zM10 7.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6z" fill="currentColor"/></svg>
      <span class="settings-label">Settings</span>
    </a>
    <button type="button" class="tool icon dark-mode-toggle" title="Dark mode" aria-label="Dark mode" aria-pressed="false" hidden>
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg>
    </button>
  </header>

  <main class="layout" id="layout" data-pane="browse">
    <aside class="browser hide-print" aria-label="Browse">
      <div class="search">
        <input type="search" id="q" placeholder="Search title, incipit or text…  ( / )" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search">
      </div>
      <div id="hours" class="chips" role="group" aria-label="Filter by hour"></div>
      <div id="filters" class="filters"></div>
      <div class="listbar">
        <span id="count" class="count"></span>
        <span class="grow"></span>
        <label class="check" id="hide-empty-wrap" title="Hide categories that have no hymns yet"><input type="checkbox" id="hide-empty"> Hide empty</label>
        <button type="button" class="link" id="expand" title="Open every category">Expand</button>
        <button type="button" class="link" id="collapse" title="Close every category">Collapse</button>
      </div>
      <div id="list" class="tree-wrap" role="navigation" aria-label="Chants"></div>
    </aside>

    <section class="viewer" aria-live="polite">
      <div class="viewbar hide-print" id="viewbar">
        <button type="button" class="tool only-narrow" id="toindex">&#9776; Index</button>
        <button type="button" class="tool" id="prev" data-for="chant" title="Previous hymn (←)">&lsaquo; Prev</button>
        <button type="button" class="tool" id="next" data-for="chant" title="Next hymn (→)">Next &rsaquo;</button>
        <span class="grow"></span>
        <span class="zoom" data-for="chant" role="group" aria-label="Size">
          <button type="button" class="tool icon" id="smaller" title="Smaller notation" aria-label="Smaller">A&minus;</button>
          <button type="button" class="tool icon" id="larger" title="Larger notation" aria-label="Larger">A+</button>
        </span>
        <button type="button" class="tool primary" id="pdf" data-for="chant" title="Make a PDF in your browser">PDF</button>
        <button type="button" class="tool" id="print" data-for="chant">Print</button>
        <button type="button" class="tool" id="download" data-for="chant" title="Download the GABC source">.gabc</button>
        <button type="button" class="tool" id="copylink" data-for="chant">Copy link</button>
        <div class="playbar" data-for="chant" role="group" aria-label="Chant playback">
          <button type="button" class="tool play-btn" id="play" title="Play / Pause (Space)" aria-pressed="false">
            <svg class="play-svg" viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M2.5 1.5l8 4.5-8 4.5z" fill="currentColor"/></svg>
            <svg class="pause-svg" viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><rect x="2" y="2" width="3" height="8" rx="0.6" fill="currentColor"/><rect x="7" y="2" width="3" height="8" rx="0.6" fill="currentColor"/></svg>
            <span id="play-label">Play</span>
          </button>
          <button type="button" class="tool icon stop-btn" id="stop" title="Stop and return to beginning" aria-label="Stop">
            <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1" fill="currentColor"/></svg>
          </button>
          <input type="range" id="seek" class="seek" min="0" max="0" value="0" aria-label="Starting note position" title="Pick or scrub note position (or click any note in the score)">
          <select id="organ" class="tool organ-select" aria-label="Organ sound" title="Organ sound">
            <option value="flute">Flute Organ</option>
            <option value="wind">Wind Organ</option>
            <option value="classic">Classic Pipe Organ</option>
          </select>
          <span class="pitch-ctrl" role="group" aria-label="Starting pitch">
            <button type="button" class="tool icon" id="pitch-down" title="Lower starting pitch" aria-label="Lower starting pitch">&minus;</button>
            <button type="button" class="tool pitch-readout" id="pitch-reset" title="Starting pitch (click to reset)">&ndash;</button>
            <button type="button" class="tool icon" id="pitch-up" title="Higher starting pitch" aria-label="Higher starting pitch">+</button>
          </span>
        </div>
      </div>

      <div id="page" class="page"></div>

      <article id="chant" class="sheet" hidden>
        <nav id="crumbs" class="crumbs hide-print" aria-label="Breadcrumb"></nav>
        <div id="kicker" class="kicker"></div>
        <h2 id="title"></h2>
        <div id="meta" class="meta"></div>
        <div id="provenance" class="provenance" hidden></div>
        <div id="variants" class="variant-tabs hide-print" role="tablist" aria-label="Variants" hidden></div>
        <div class="rule" aria-hidden="true"><i></i></div>
        <div id="commentary" class="commentary"></div>
        <div id="score" class="score"></div>
        <div id="colophon" class="colophon"></div>
        <details class="hide-print source">
          <summary>GABC source</summary>
          <pre id="source"></pre>
        </details>
      </article>
    </section>
  </main>

  <div style="text-align:center;padding:12px"><a href="missing-score-candidates.html">Review external candidates for missing GABC scores (UNCHECKED)</a></div>
  <script src="jquery.min.js"></script>
  <script src="exsurge.min.js"></script>
  <script src="js/chant-pdf.js"></script>
  <script src="js/chant-player.js"></script>
  <script src="app.js"></script>

<div style="position:fixed;right:12px;bottom:12px;z-index:9999;background:#fff;border:1px solid #777;padding:8px 12px;border-radius:6px;box-shadow:0 2px 8px #0002;font:14px sans-serif"><a href="reference/Liber-Hymnarius-1983.pdf" target="_blank" rel="noopener">Open 1983 source scan (320 PDF pages)</a></div>
</body>
</html>
